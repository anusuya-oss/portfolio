version: '3.8'

services:
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: portfolio-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:5000/api
    depends_on:
      - backend
    networks:
      - portfolio-network

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: portfolio-backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/portfolio
      - JWT_SECRET=${JWT_SECRET}
      - GITHUB_USERNAME=${GITHUB_USERNAME}
    depends_on:
      - mongodb
    networks:
      - portfolio-network

  mongodb:
    image: mongo:latest
    container_name: portfolio-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - portfolio-network

networks:
  portfolio-network:
    driver: bridge

volumes:
  mongodb_data:
